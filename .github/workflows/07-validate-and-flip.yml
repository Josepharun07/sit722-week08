name: 07 - Validate Green + Flip Traffic

# Continuous Delivery — Stage 2 of Blue/Green release
# Runs AFTER 06. k6 quality gate → flip to Green ONLY if healthy.
# On failure: auto-rollback to Blue + scale Green to 0.

on:
  workflow_run:
    workflows: ["06 - Deploy to Green"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA on Green (for emails; optional on auto runs)"
        required: false
        type: string
        default: "auto"

jobs:
  validate-and-flip:
    name: k6 Gate + Flip
    runs-on: ubuntu-latest
    environment: production
    if: >
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ] && [ "${{ inputs.image_tag }}" != "auto" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${{ github.event.workflow_run.head_sha || github.sha }}"
          fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Using image tag: $TAG"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Setup k6 Script
        run: |
          kubectl create configmap k6-load-test-script --namespace monitoring \
            --from-file=load-test.js=k6/load-test.js --dry-run=client -o yaml | kubectl apply -f -

      - name: Run k6 quality gate against Green
        run: |
          kubectl delete job k6-load-test -n monitoring --ignore-not-found=true
          sleep 3

          GREEN_POD_IP=$(kubectl get pods -n production -l app=user-service,slot=green \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].status.podIP}')
          if [ -z "$GREEN_POD_IP" ]; then
            echo "ERROR: No Running green user-service pod. Workflow 06 must succeed first."
            kubectl get pods -n production -l slot=green -o wide || true
            exit 1
          fi
          echo "Testing green user-service at $GREEN_POD_IP:8000"

          sed "s|REPLACE_SERVICE_URL|http://${GREEN_POD_IP}:8000|g" k6/k6-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/k6-load-test -n monitoring --timeout=300s

      - name: Collect k6 results from logs
        run: |
          K6_POD=$(kubectl get pods -n monitoring -l job-name=k6-load-test \
            -o jsonpath='{.items[0].metadata.name}')
          kubectl logs "$K6_POD" -n monitoring | tee /tmp/k6-full.log

          if ! grep -q '@@@K6_SUMMARY_START@@@' /tmp/k6-full.log; then
            echo "ERROR: k6 summary delimiters not found"
            exit 1
          fi

          sed -n '/@@@K6_SUMMARY_START@@@/,/@@@K6_SUMMARY_END@@@/p' /tmp/k6-full.log \
            | sed '1d;$d' > /tmp/k6-summary.json
          cat /tmp/k6-summary.json
          jq . /tmp/k6-summary.json > /dev/null

          echo "K6_P95=$(jq -r '.p95_duration_ms // "n/a"' /tmp/k6-summary.json)" >> "$GITHUB_ENV"
          echo "K6_ERR=$(jq -r '.error_rate // "n/a"' /tmp/k6-summary.json)" >> "$GITHUB_ENV"
          PASSED=$(jq -r '.thresholds_passed // false' /tmp/k6-summary.json)
          if [ "$PASSED" != "true" ]; then
            echo "k6 quality gate FAILED — will auto-rollback"
            exit 1
          fi
          echo "k6 quality gate PASSED"

      - name: Flip Services to Green
        run: |
          kubectl patch service frontend -n production --type=merge \
            -p '{"spec":{"selector":{"app":"frontend","slot":"green"}}}'
          for svc in user-service student-service lecturer-service course-service enrollment-service; do
            kubectl patch service "$svc" -n production --type=merge \
              -p "{\"spec\":{\"selector\":{\"app\":\"$svc\",\"slot\":\"green\"}}}"
          done
          kubectl get svc -n production -o custom-columns='NAME:.metadata.name,SELECTOR:.spec.selector'

      - name: Post-flip smoke test
        run: |
          FRONTEND_IP=$(kubectl get svc frontend -n production \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Frontend IP: $FRONTEND_IP"
          curl --fail --retry 8 --retry-delay 5 --max-time 15 "http://${FRONTEND_IP}/"
          echo "Post-flip smoke test PASSED"

      - name: Auto-rollback to Blue on failure
        if: failure()
        run: |
          echo "=== CD AUTO-ROLLBACK TO BLUE ==="
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing || true

          kubectl patch service frontend -n production --type=merge \
            -p '{"spec":{"selector":{"app":"frontend","slot":"blue"}}}' || true
          for svc in user-service student-service lecturer-service course-service enrollment-service; do
            kubectl patch service "$svc" -n production --type=merge \
              -p "{\"spec\":{\"selector\":{\"app\":\"$svc\",\"slot\":\"blue\"}}}" || true
          done
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            if kubectl get deployment "${svc}-green" -n production >/dev/null 2>&1; then
              kubectl scale deployment/"${svc}-green" -n production --replicas=0 || true
              echo "Scaled ${svc}-green → 0"
            fi
          done
          echo "Blue restored"
          kubectl get svc -n production -o custom-columns='NAME:.metadata.name,SELECTOR:.spec.selector'

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: KoalaTech SRE <${{ secrets.GMAIL_USERNAME }}>
          subject: "[CD SUCCESS] Traffic Flipped to Green — SHA: ${{ env.IMAGE_TAG }}"
          html_body: |
            <h2 style="color:#27ae60;">Continuous Delivery Release SUCCESS</h2>
            <p><b>Image SHA:</b> <code>${{ env.IMAGE_TAG }}</code></p>
            <p><b>k6 P95:</b> ${{ env.K6_P95 }} ms (SLA &lt;500ms)</p>
            <p><b>k6 Error Rate:</b> ${{ env.K6_ERR }}</p>
            <p>Live traffic is on <b>Green</b>. Blue remains warm standby.</p>
            <p>Manual rollback: workflow 08.</p>

      - name: Send Auto-Rollback Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: KoalaTech SRE <${{ secrets.GMAIL_USERNAME }}>
          subject: "[CD AUTO-ROLLBACK] Green failed — Blue restored — SHA: ${{ env.IMAGE_TAG }}"
          html_body: |
            <h2 style="color:#c0392b;">Auto-Rollback Executed</h2>
            <p><b>SHA:</b> <code>${{ env.IMAGE_TAG }}</code></p>
            <p><b>k6 P95:</b> ${{ env.K6_P95 }} | <b>Error rate:</b> ${{ env.K6_ERR }}</p>
            <p>k6 gate or smoke test failed. Traffic restored to Blue. Green scaled to 0.</p>
