name: 07 - Validate Green + Flip Traffic

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA currently on Green"
        required: true
        type: string

jobs:
  validate-and-flip:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az aks get-credentials --resource-group ${{ vars.AKS_RESOURCE_GROUP }} --name ${{ vars.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Setup k6 Script
        run: |
          kubectl create configmap k6-load-test-script --namespace monitoring \
            --from-file=load-test.js=k6/load-test.js --dry-run=client -o yaml | kubectl apply -f -

      - name: Run k6 Load Test against Green Pods
        run: |
          kubectl delete job k6-load-test -n monitoring --ignore-not-found=true
          # Grab the internal IP of the green user-service pod directly
          GREEN_POD_IP=$(kubectl get pods -n production -l app=user-service,slot=green -o jsonpath='{.items[0].status.podIP}')
          sed "s|http://user-service.production-green.svc.cluster.local:8000|http://$GREEN_POD_IP:8000|g" k6/k6-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/k6-load-test -n monitoring --timeout=300s

      - name: Collect k6 results
        run: |
          K6_POD=$(kubectl get pods -n monitoring -l job-name=k6-load-test -o jsonpath='{.items[0].metadata.name}')
          kubectl cp "monitoring/$K6_POD:/tmp/k6-summary.json" /tmp/k6-summary.json || true
          echo "K6_P95=$(jq -r '.p95_duration_ms' /tmp/k6-summary.json)" >> "$GITHUB_ENV"
          echo "K6_ERR=$(jq -r '.error_rate' /tmp/k6-summary.json)" >> "$GITHUB_ENV"

      - name: Flip Services to Green
        run: |
          kubectl patch service koalatech-frontend -n production --type=merge -p '{"spec":{"selector":{"slot":"green"}}}'
          for svc in user-service student-service lecturer-service course-service enrollment-service; do
            kubectl patch service $svc -n production --type=merge -p '{"spec":{"selector":{"slot":"green"}}}'
          done

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: KoalaTech SRE <${{ secrets.GMAIL_USERNAME }}>
          subject: "[SUCCESS] Traffic Flipped to Green — SHA: ${{ inputs.image_tag }}"
          html_body: |
            <h2 style="color:#27ae60;">Traffic Successfully Flipped to Green</h2>
            <p><b>k6 P95 Latency:</b> ${{ env.K6_P95 }} ms (SLA: &lt;500ms)</p>
            <p><b>k6 Error Rate:</b> ${{ env.K6_ERR }}</p>

      - name: Send Failure Alert Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: KoalaTech SRE <${{ secrets.GMAIL_USERNAME }}>
          subject: "[CRITICAL] k6 Validation FAILED — SHA: ${{ inputs.image_tag }}"
          html_body: '<h2 style="color:#c0392b;">k6 Load Test FAILED</h2><p>Traffic was NOT flipped.</p>'