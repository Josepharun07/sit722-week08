name: 04 - Deploy to Production

on:
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    if: >
      ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply database manifests first
        run: |
          kubectl apply -f kubernetes/production/01-namespace.yaml
          kubectl apply -f kubernetes/production/02-user-db.yaml
          kubectl apply -f kubernetes/production/03-student-db.yaml
          kubectl apply -f kubernetes/production/04-lecturer-db.yaml
          kubectl apply -f kubernetes/production/05-course-db.yaml
          kubectl apply -f kubernetes/production/06-enrollment-db.yaml

      - name: Wait for databases
        run: |
          for db in user-db student-db lecturer-db course-db enrollment-db; do
            echo "Waiting for ${db}..."
            kubectl rollout status deployment/"${db}" -n production --timeout=300s
          done

      - name: Ensure application databases exist
        run: |
          # POSTGRES_DB only runs on first init. Reused PVCs may lack the named DB.
          ensure_db() {
            local deploy="$1"
            local dbname="$2"
            kubectl exec -n production "deploy/${deploy}" -- \
              psql -U postgres -v ON_ERROR_STOP=1 -tc \
              "SELECT 1 FROM pg_database WHERE datname='${dbname}'" | grep -q 1 \
              || kubectl exec -n production "deploy/${deploy}" -- \
                psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${dbname};"
            echo "OK: ${dbname}"
          }
          ensure_db user-db users
          ensure_db student-db students
          ensure_db lecturer-db lecturers
          ensure_db course-db courses
          ensure_db enrollment-db enrollments

      - name: Deploy Blue apps with real images
        run: |
          set -e
          ACR="${{ vars.ACR_LOGIN_SERVER }}"
          TAG="${{ github.event.workflow_run.head_sha }}"
          mkdir -p /tmp/blue

          # Never apply placeholder images — inject the real ACR tag first
          sed "s|image: placeholder|image: ${ACR}/koalatech-user-service:${TAG}|g" \
            kubernetes/production/07-user-service.yaml > /tmp/blue/07-user-service.yaml
          sed "s|image: placeholder|image: ${ACR}/koalatech-student-service:${TAG}|g" \
            kubernetes/production/08-student-service.yaml > /tmp/blue/08-student-service.yaml
          sed "s|image: placeholder|image: ${ACR}/koalatech-lecturer-service:${TAG}|g" \
            kubernetes/production/09-lecturer-service.yaml > /tmp/blue/09-lecturer-service.yaml
          sed "s|image: placeholder|image: ${ACR}/koalatech-course-service:${TAG}|g" \
            kubernetes/production/10-course-service.yaml > /tmp/blue/10-course-service.yaml
          sed "s|image: placeholder|image: ${ACR}/koalatech-enrollment-service:${TAG}|g" \
            kubernetes/production/11-enrollment-service.yaml > /tmp/blue/11-enrollment-service.yaml
          sed "s|image: placeholder|image: ${ACR}/koalatech-frontend:${TAG}|g" \
            kubernetes/production/12-frontend.yaml > /tmp/blue/12-frontend.yaml

          # Recreate so old placeholder RSes cannot block RollingUpdate
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            kubectl delete deployment "$svc" -n production --ignore-not-found=true
          done
          kubectl apply -f /tmp/blue/

          # Keep Services pointing at Blue
          kubectl patch service frontend -n production --type=merge \
            -p '{"spec":{"selector":{"app":"frontend","slot":"blue"}}}' || true
          for svc in user-service student-service lecturer-service course-service enrollment-service; do
            kubectl patch service "$svc" -n production --type=merge \
              -p "{\"spec\":{\"selector\":{\"app\":\"$svc\",\"slot\":\"blue\"}}}" || true
          done

      - name: Wait for Blue app rollouts
        run: |
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            echo "Waiting for ${svc}..."
            kubectl rollout status deployment/"${svc}" -n production --timeout=300s
          done

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production
