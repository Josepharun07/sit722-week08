name: 08 - Rollback to Blue

on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az aks get-credentials --resource-group ${{ vars.AKS_RESOURCE_GROUP }} --name ${{ vars.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Patch Services back to Blue
        run: |
          kubectl patch service koalatech-frontend -n production --type=merge -p '{"spec":{"selector":{"slot":"blue"}}}'
          for svc in user-service student-service lecturer-service course-service enrollment-service; do
            kubectl patch service $svc -n production --type=merge -p '{"spec":{"selector":{"slot":"blue"}}}'
          done

      - name: Scale Green to zero
        run: |
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            kubectl scale deployment/$svc-green -n production --replicas=0 --ignore-not-found=true
          done

      - name: Send Rollback Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: KoalaTech SRE <${{ secrets.GMAIL_USERNAME }}>
          subject: "[ROLLBACK] KoalaTech Production Restored to Blue"
          html_body: '<h2 style="color:#c0392b;">Production Rollback Executed</h2>'