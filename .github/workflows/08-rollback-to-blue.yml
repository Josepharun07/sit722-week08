name: 08 - Rollback to Blue

# Continuous Delivery safety net:
# - Auto-runs when workflow 06 fails (belt-and-suspenders rollback)
# - Also available for manual emergency rollback

on:
  workflow_run:
    workflows: ["06 - Deploy to Green"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  rollback:
    name: Rollback to Blue
    runs-on: ubuntu-latest
    environment: production
    if: >
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Patch Services back to Blue
        run: |
          kubectl patch service frontend -n production --type=merge \
            -p '{"spec":{"selector":{"app":"frontend","slot":"blue"}}}'
          for svc in user-service student-service lecturer-service course-service enrollment-service; do
            kubectl patch service "$svc" -n production --type=merge \
              -p "{\"spec\":{\"selector\":{\"app\":\"$svc\",\"slot\":\"blue\"}}}"
          done
          echo "Traffic reverted to Blue slot"
          kubectl get svc -n production -o custom-columns='NAME:.metadata.name,SELECTOR:.spec.selector'

      - name: Smoke-test frontend after rollback
        run: |
          FRONTEND_IP=$(kubectl get svc frontend -n production \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Frontend IP: $FRONTEND_IP"
          curl --fail --retry 5 --retry-delay 5 --max-time 10 "http://${FRONTEND_IP}/" || true

      - name: Scale Green to zero
        run: |
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            if kubectl get deployment "${svc}-green" -n production >/dev/null 2>&1; then
              kubectl scale deployment/"${svc}-green" -n production --replicas=0
              echo "Scaled ${svc}-green to 0"
            else
              echo "Deployment ${svc}-green not found — skipping"
            fi
          done

      - name: Send Rollback Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: KoalaTech SRE <${{ secrets.GMAIL_USERNAME }}>
          subject: "[CD ROLLBACK] KoalaTech Production Restored to Blue"
          html_body: |
            <h2 style="color:#c0392b;">Production Rollback to Blue</h2>
            <p>Trigger: ${{ github.event_name }}</p>
            <p>All services reverted to Blue. Green deployments scaled to 0.</p>
            <p>Continuous Delivery safety net kept production on the last known-good slot.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View workflow run</a></p>
