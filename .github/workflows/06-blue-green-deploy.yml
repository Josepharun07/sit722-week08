name: 06 - Deploy to Green

# Fully automatic after 05: deploy Green → k6 validate → flip traffic (one job).
# Workflow 07 remains available for manual re-validate/flip.
# Workflow 08 remains manual rollback only.

on:
  workflow_run:
    workflows: ["05 - Deploy Monitoring Stack"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA already built/pushed by CI (must exist in ACR)"
        required: true
        type: string

jobs:
  deploy-validate-flip:
    name: Green Deploy + k6 + Flip
    runs-on: ubuntu-latest
    environment: production
    if: >
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Using image tag: $TAG"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Ensure ACR is attached to AKS
        run: |
          az aks update \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --attach-acr ${{ vars.ACR_NAME }} || true

      - name: Verify images exist in ACR
        run: |
          set -e
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            echo "Checking ${{ vars.ACR_LOGIN_SERVER }}/koalatech-${svc}:${IMAGE_TAG}"
            az acr repository show \
              --name ${{ vars.ACR_NAME }} \
              --image "koalatech-${svc}:${IMAGE_TAG}" \
              --query "name" -o tsv
          done

      - name: Ensure secrets + DBs
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic postgres-secret --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic application-secret --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f kubernetes/production/01-namespace.yaml
          kubectl apply -f kubernetes/production/02-user-db.yaml
          kubectl apply -f kubernetes/production/03-student-db.yaml
          kubectl apply -f kubernetes/production/04-lecturer-db.yaml
          kubectl apply -f kubernetes/production/05-course-db.yaml
          kubectl apply -f kubernetes/production/06-enrollment-db.yaml

      - name: Deploy Green with real images
        run: |
          set -e
          mkdir -p /tmp/green
          ACR="${{ vars.ACR_LOGIN_SERVER }}"

          sed "s|image: placeholder|image: ${ACR}/koalatech-user-service:${IMAGE_TAG}|g" \
            kubernetes/production-green/07-user-service.yaml > /tmp/green/07-user-service.yaml
          sed "s|image: placeholder|image: ${ACR}/koalatech-student-service:${IMAGE_TAG}|g" \
            kubernetes/production-green/08-student-service.yaml > /tmp/green/08-student-service.yaml
          sed "s|image: placeholder|image: ${ACR}/koalatech-lecturer-service:${IMAGE_TAG}|g" \
            kubernetes/production-green/09-lecturer-service.yaml > /tmp/green/09-lecturer-service.yaml
          sed "s|image: placeholder|image: ${ACR}/koalatech-course-service:${IMAGE_TAG}|g" \
            kubernetes/production-green/10-course-service.yaml > /tmp/green/10-course-service.yaml
          sed "s|image: placeholder|image: ${ACR}/koalatech-enrollment-service:${IMAGE_TAG}|g" \
            kubernetes/production-green/11-enrollment-service.yaml > /tmp/green/11-enrollment-service.yaml
          sed "s|image: placeholder|image: ${ACR}/koalatech-frontend:${IMAGE_TAG}|g" \
            kubernetes/production-green/12-frontend.yaml > /tmp/green/12-frontend.yaml

          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            kubectl delete deployment "${svc}-green" -n production --ignore-not-found=true
          done
          kubectl apply -f /tmp/green/

      - name: Wait for Green Rollouts
        run: |
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            echo "Waiting for ${svc}-green..."
            kubectl rollout status deployment/${svc}-green -n production --timeout=300s
          done
          kubectl get pods -n production -l slot=green -o wide

      - name: Setup k6 script ConfigMap
        run: |
          kubectl create configmap k6-load-test-script --namespace monitoring \
            --from-file=load-test.js=k6/load-test.js --dry-run=client -o yaml | kubectl apply -f -

      - name: Run k6 Load Test against Green
        run: |
          kubectl delete job k6-load-test -n monitoring --ignore-not-found=true
          sleep 3

          GREEN_POD_IP=$(kubectl get pods -n production -l app=user-service,slot=green \
            --field-selector=status.phase=Running \
            -o jsonpath='{.items[0].status.podIP}')
          if [ -z "$GREEN_POD_IP" ]; then
            echo "ERROR: No Running green user-service pod found."
            kubectl get pods -n production -l slot=green -o wide
            exit 1
          fi
          echo "Testing green user-service at $GREEN_POD_IP:8000"

          sed "s|REPLACE_SERVICE_URL|http://${GREEN_POD_IP}:8000|g" k6/k6-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/k6-load-test -n monitoring --timeout=300s

      - name: Collect k6 results from logs
        id: k6
        run: |
          K6_POD=$(kubectl get pods -n monitoring -l job-name=k6-load-test \
            -o jsonpath='{.items[0].metadata.name}')
          echo "k6 pod: $K6_POD"
          kubectl logs "$K6_POD" -n monitoring | tee /tmp/k6-full.log

          # Parse marker printed by handleSummary (kubectl cp cannot read Succeeded pods)
          if grep -q 'K6_SUMMARY_JSON=' /tmp/k6-full.log; then
            grep 'K6_SUMMARY_JSON=' /tmp/k6-full.log | tail -1 | sed 's/^.*K6_SUMMARY_JSON=//' > /tmp/k6-summary.json
            cat /tmp/k6-summary.json
            echo "K6_P95=$(jq -r '.p95_duration_ms // "n/a"' /tmp/k6-summary.json)" >> "$GITHUB_ENV"
            echo "K6_ERR=$(jq -r '.error_rate // "n/a"' /tmp/k6-summary.json)" >> "$GITHUB_ENV"
            PASSED=$(jq -r '.thresholds_passed // false' /tmp/k6-summary.json)
            if [ "$PASSED" != "true" ]; then
              echo "k6 thresholds failed — refusing traffic flip"
              exit 1
            fi
          else
            # Fallback: if job succeeded and thresholds printed OK in k6 output
            if grep -q 'thresholds.*✓\|checks_total' /tmp/k6-full.log || grep -q '✓' /tmp/k6-full.log; then
              echo "K6_P95=see-logs" >> "$GITHUB_ENV"
              echo "K6_ERR=see-logs" >> "$GITHUB_ENV"
              echo "WARNING: marker missing but job completed — checking job status"
              kubectl get job k6-load-test -n monitoring -o jsonpath='{.status.succeeded}' | grep -q 1
            else
              echo "ERROR: k6 summary marker not found"
              exit 1
            fi
          fi

      - name: Flip Services to Green
        run: |
          kubectl patch service frontend -n production --type=merge \
            -p '{"spec":{"selector":{"app":"frontend","slot":"green"}}}'
          for svc in user-service student-service lecturer-service course-service enrollment-service; do
            kubectl patch service "$svc" -n production --type=merge \
              -p "{\"spec\":{\"selector\":{\"app\":\"$svc\",\"slot\":\"green\"}}}"
          done
          echo "Traffic flipped to Green slot"
          kubectl get svc -n production -o wide

      - name: Smoke-test frontend after flip
        run: |
          FRONTEND_IP=$(kubectl get svc frontend -n production \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "Frontend IP: $FRONTEND_IP"
          curl --fail --retry 5 --retry-delay 5 --max-time 10 "http://$FRONTEND_IP" || true

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: KoalaTech SRE <${{ secrets.GMAIL_USERNAME }}>
          subject: "[SUCCESS] Green Deployed + Traffic Flipped — SHA: ${{ env.IMAGE_TAG }}"
          html_body: |
            <h2 style="color:#27ae60;">Green Deploy + Traffic Flip SUCCESS</h2>
            <p><b>Image SHA:</b> <code>${{ env.IMAGE_TAG }}</code></p>
            <p><b>k6 P95 Latency:</b> ${{ env.K6_P95 }} ms (SLA: &lt;500ms)</p>
            <p><b>k6 Error Rate:</b> ${{ env.K6_ERR }}</p>
            <p>Blue remains as hot-standby. Run workflow 08 to rollback.</p>

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: KoalaTech SRE <${{ secrets.GMAIL_USERNAME }}>
          subject: "[CRITICAL] Green/k6 FAILED — SHA: ${{ env.IMAGE_TAG }}"
          html_body: |
            <h2 style="color:#c0392b;">Green Deploy or k6 Validation FAILED</h2>
            <p><b>Image SHA:</b> <code>${{ env.IMAGE_TAG }}</code></p>
            <p>Traffic was NOT flipped (or flip did not complete). Blue remains live.</p>
            <p>Run workflow 08 if Green needs cleanup.</p>
