name: 06 - Deploy to Green

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA to deploy"
        required: true
        type: string

jobs:
  deploy-green:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: az aks get-credentials --resource-group ${{ vars.AKS_RESOURCE_GROUP }} --name ${{ vars.AKS_CLUSTER_NAME }} --overwrite-existing

      - name: Apply Base Production (DBs, Services, Blue Pods)
        run: |
          kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic postgres-secret --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic application-secret --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f kubernetes/production/
        
      - name: Deploy Green Pods
        run: kubectl apply -f kubernetes/production-green/

      - name: Update Images on Green Deployments
        run: |
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            kubectl set image deployment/$svc-green $svc=${{ vars.ACR_LOGIN_SERVER }}/koalatech-$svc:${{ inputs.image_tag }} -n production
          done

      - name: Wait for Green Rollouts
        run: |
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            kubectl rollout status deployment/$svc-green -n production --timeout=300s
          done

      - name: Send Green Ready Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: KoalaTech SRE <${{ secrets.GMAIL_USERNAME }}>
          subject: "[READY] Green Environment Deployed — SHA: ${{ inputs.image_tag }}"
          html_body: "<h2>Green Deployment Ready</h2><p>SHA: ${{ inputs.image_tag }}</p><p>Run Workflow 07 to validate and flip.</p>"