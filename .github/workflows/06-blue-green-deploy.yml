name: 06 - Deploy to Green (Blue/Green)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA to deploy to Green (must have passed CI + staging)"
        required: true
        type: string

jobs:
  deploy-green:
    name: Deploy Image to Production-Green
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.image_tag }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Apply production-blue namespace + secrets
        run: |
          kubectl apply -f kubernetes/production-blue/01-namespace.yaml
          kubectl create secret generic postgres-secret --namespace production-blue \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic application-secret --namespace production-blue \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f kubernetes/production-blue/

      - name: Apply production-green namespace
        run: kubectl apply -f kubernetes/production-green/01-namespace.yaml

      - name: Create postgres-secret (green)
        run: |
          kubectl create secret generic postgres-secret --namespace production-green \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create application-secret (green)
        run: |
          kubectl create secret generic application-secret --namespace production-green \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply production-green manifests
        run: kubectl apply -f kubernetes/production-green/

      - name: Set image — frontend (green)
        run: kubectl set image deployment/frontend frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ inputs.image_tag }} -n production-green

      - name: Set image — user-service (green)
        run: kubectl set image deployment/user-service user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ inputs.image_tag }} -n production-green

      - name: Set image — student-service (green)
        run: kubectl set image deployment/student-service student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ inputs.image_tag }} -n production-green

      - name: Set image — lecturer-service (green)
        run: kubectl set image deployment/lecturer-service lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ inputs.image_tag }} -n production-green

      - name: Set image — course-service (green)
        run: kubectl set image deployment/course-service course-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ inputs.image_tag }} -n production-green

      - name: Set image — enrollment-service (green)
        run: kubectl set image deployment/enrollment-service enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ inputs.image_tag }} -n production-green

      - name: Wait for green rollouts
        run: |
          for svc in frontend user-service student-service lecturer-service course-service enrollment-service; do
            kubectl rollout status deployment/$svc -n production-green --timeout=300s
          done

      - name: Verify green pod health
        run: |
          kubectl get pods -n production-green -o wide
          NOT_RUNNING=$(kubectl get pods -n production-green --no-headers \
            -o custom-columns='STATUS:.status.phase' | grep -v Running | wc -l)
          if [ "$NOT_RUNNING" -gt 0 ]; then
            echo "ERROR: $NOT_RUNNING pod(s) not Running"
            kubectl describe pods -n production-green
            exit 1
          fi
          echo "All green pods Running."

      - name: Send green deployment email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: KoalaTech CI/CD <${{ secrets.GMAIL_USERNAME }}>
          subject: "[${{ job.status }}] Green Deployment — SHA: ${{ inputs.image_tag }}"
          html_body: |
            <h2 style="color:#27ae60;">Green Deployment - ${{ job.status }}</h2>
            <p><b>Image SHA:</b> <code>${{ inputs.image_tag }}</code></p>
            <p><b>Namespace:</b> production-green</p>
            <p><b>Next step:</b> Run workflow 07 - Validate Green + Flip Traffic with the same SHA.</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View workflow run</a></p>
