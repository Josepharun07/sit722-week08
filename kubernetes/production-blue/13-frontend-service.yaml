# THE TRAFFIC FLIP SERVICE
# Selector .slot is patched blue->green by workflow 07.
apiVersion: v1
kind: Service
metadata:
  name: koalatech-frontend
  namespace: production-blue
  labels:
    app: frontend
    role: traffic-flip-endpoint
spec:
  type: LoadBalancer
  selector:
    app: frontend
    slot: blue
  ports:
    - name: http
      port: 80
      targetPort: 80
