apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: production-green
  labels:
    app: user-service
    slot: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        slot: green
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: user-service
          image: placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: users
            - name: POSTGRES_HOST
              value: user + "-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: JWT_SECRET_KEY
            - name: JWT_ALGORITHM
              value: HS256

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: production-green
spec:
  selector:
    app: user-service
  ports:
    - port: 8000
      targetPort: 8000
