apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-green
  namespace: production
  labels:
    app: frontend
    slot: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      slot: green
  template:
    metadata:
      labels:
        app: frontend
        slot: green
    spec:
      containers:
        - name: frontend
          image: placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
