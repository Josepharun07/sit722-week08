apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: koalatech-fastapi-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - production
  selector:
    matchExpressions:
      - key: app
        operator: Exists
  endpoints:
    - port: http
      path: /metrics
      interval: 10s