apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
      external_labels:
        cluster: koalatech-aks
        environment: production

    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager:9093]

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: kubernetes-apiservers
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      - job_name: kubernetes-nodes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: service

      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics:8080]

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            action: keep
            regex: node-exporter

      - job_name: pushgateway
        honor_labels: true
        static_configs:
          - targets: [pushgateway:9091]

      - job_name: alertmanager
        static_configs:
          - targets: [alertmanager:9093]

  koalatech-alerts.yml: |
    groups:
      - name: koalatech-service-health
        interval: 30s
        rules:
          - alert: HighErrorRate
            expr: |
              (sum by (service, kubernetes_namespace) (rate(http_requests_total{status=~"5.."}[2m]))
              / sum by (service, kubernetes_namespace) (rate(http_requests_total[2m]))) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "High HTTP error rate on {{ $labels.service }}"
              description: "{{ $labels.service }} has >5% error rate for 2 minutes."

          - alert: HighLatency
            expr: |
              histogram_quantile(0.95, sum by (service, kubernetes_namespace, le) (
                rate(http_request_duration_seconds_bucket[5m]))) > 1.0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High P95 latency on {{ $labels.service }}"
              description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 1s)."

          - alert: PodCrashLooping
            expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Pod crash-looping: {{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is in CrashLoopBackOff."

          - alert: DeploymentReplicasUnavailable
            expr: kube_deployment_status_replicas_unavailable > 0
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Deployment {{ $labels.deployment }} has unavailable replicas"
              description: "{{ $labels.deployment }} in {{ $labels.namespace }} has {{ $value }} unavailable replica(s)."

          - alert: NodeHighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Node {{ $labels.instance }} memory > 85%"
              description: "Memory usage on {{ $labels.instance }} is {{ $value | humanizePercentage }}."

          - alert: K6LoadTestFailed
            expr: k6_checks_total{check="status 200",result="fail"} > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "k6 load test reported failures"
              description: "k6 check reported {{ $value }} failures. Green environment may be unhealthy."

      - name: blue-green-deployment
        interval: 15s
        rules:
          - alert: GreenPodsNotReady
            expr: |
              kube_deployment_status_replicas_ready{namespace="production-green"}
              < kube_deployment_spec_replicas{namespace="production-green"}
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Green pods not fully ready after 10 minutes"
              description: "Deployment {{ $labels.deployment }} in production-green is not fully ready."
